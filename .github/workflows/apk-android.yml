name: Build ABDULMALIK ERP Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, abdulmalik/development]
    paths:
      - 'source/**'
      - '.github/workflows/apk-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: source
        run: flutter pub get
      - name: Build debug APK
        working-directory: source
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABDULMALIK-ERP-Android-APK
          path: source/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
